<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Random Video Chat</h1>
            <div class="status-indicator">
                <span id="status-dot" class="dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <div class="video-container">
            <!-- Remote video (partner) -->
            <div class="video-wrapper remote-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="remote-placeholder" class="placeholder">
                    <div class="placeholder-content">
                        <div class="spinner"></div>
                        <p id="remote-status">Waiting for partner...</p>
                    </div>
                </div>
            </div>

            <!-- Local video (you) -->
            <div class="video-wrapper local-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="local-label">You</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">
                <span class="btn-icon">▶</span>
                Start
            </button>
            <button id="skipBtn" class="btn btn-secondary" disabled>
                <span class="btn-icon">⏭</span>
                Next
            </button>
            <button id="toggleVideoBtn" class="btn btn-icon-only" title="Toggle Video">
                <span class="btn-icon">📹</span>
            </button>
            <button id="toggleAudioBtn" class="btn btn-icon-only" title="Toggle Audio">
                <span class="btn-icon">🎤</span>
            </button>
        </div>

        <div class="stats">
            <span>👥 Users online: <strong id="onlineCount">-</strong></span>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
