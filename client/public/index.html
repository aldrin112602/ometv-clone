<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-animation {
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-600 via-purple-700 to-indigo-800 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-6xl">
        <!-- Main Container -->
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            
            <!-- Header -->
            <header class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-6 py-5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fas fa-video text-2xl"></i>
                    <h1 class="text-2xl font-bold">Random Video Chat</h1>
                </div>
                <div class="flex items-center gap-2 bg-white/20 px-4 py-2 rounded-full">
                    <span 
                        :class="[
                            'w-3 h-3 rounded-full',
                            statusClass,
                            'pulse-animation'
                        ]"
                    ></span>
                    <span class="text-sm font-medium">{{ statusText }}</span>
                </div>
            </header>

            <!-- Video Container -->
            <div class="relative bg-black aspect-video">
                
                <!-- Remote Video (Partner) -->
                <div class="relative w-full h-full">
                    <video 
                        ref="remoteVideo" 
                        autoplay 
                        playsinline
                        :class="['w-full h-full object-cover', remoteVideoActive ? 'block' : 'hidden']"
                    ></video>
                    
                    <!-- Placeholder when no partner -->
                    <div 
                        v-if="!remoteVideoActive"
                        class="absolute inset-0 bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center"
                    >
                        <div class="text-center text-white">
                            <div class="w-16 h-16 border-4 border-white/30 border-t-white rounded-full spinner mx-auto mb-4"></div>
                            <p class="text-lg font-medium">{{ remoteStatus }}</p>
                        </div>
                    </div>
                </div>

                <!-- Local Video (You) -->
                <div class="absolute bottom-4 right-4 w-60 h-44 rounded-xl overflow-hidden shadow-xl border-4 border-white">
                    <video 
                        ref="localVideo" 
                        autoplay 
                        muted 
                        playsinline
                        class="w-full h-full object-cover"
                    ></video>
                    <div class="absolute bottom-2 left-2 bg-black/70 text-white px-3 py-1 rounded-lg text-sm font-medium">
                        <i class="fas fa-user mr-1"></i> You
                    </div>
                </div>

            </div>

            <!-- Controls -->
            <div class="bg-gray-50 px-6 py-6 flex justify-center items-center gap-3 border-t border-gray-200">
                
                <!-- Start/Find Partner Button -->
                <button 
                    @click="handleStartButton"
                    class="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i :class="['fas', isStarted ? 'fa-search' : 'fa-play']"></i>
                    <span>{{ isStarted ? 'Find Partner' : 'Start' }}</span>
                </button>

                <!-- Skip/Next Button -->
                <button 
                    @click="skip"
                    :disabled="!skipEnabled"
                    class="flex items-center gap-2 px-6 py-3 bg-red-500 text-white rounded-xl font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="fas fa-forward"></i>
                    <span>Next</span>
                </button>

                <!-- Toggle Video Button -->
                <button 
                    @click="toggleVideo"
                    :class="[
                        'flex items-center justify-center w-12 h-12 rounded-xl font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200',
                        isVideoEnabled ? 'bg-gray-600 text-white' : 'bg-gray-400 text-gray-700'
                    ]"
                    :title="isVideoEnabled ? 'Disable Video' : 'Enable Video'"
                >
                    <i :class="['fas text-lg', isVideoEnabled ? 'fa-video' : 'fa-video-slash']"></i>
                </button>

                <!-- Toggle Audio Button -->
                <button 
                    @click="toggleAudio"
                    :class="[
                        'flex items-center justify-center w-12 h-12 rounded-xl font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200',
                        isAudioEnabled ? 'bg-gray-600 text-white' : 'bg-gray-400 text-gray-700'
                    ]"
                    :title="isAudioEnabled ? 'Mute' : 'Unmute'"
                >
                    <i :class="['fas text-lg', isAudioEnabled ? 'fa-microphone' : 'fa-microphone-slash']"></i>
                </button>

            </div>

            <!-- Stats -->
            <div class="bg-white px-6 py-4 text-center text-gray-600 border-t border-gray-200">
                <i class="fas fa-users mr-2"></i>
                <span>Users online: <strong class="text-gray-900">{{ onlineCount }}</strong></span>
            </div>

        </div>
    </div>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.js"></script>
    
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    
    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
